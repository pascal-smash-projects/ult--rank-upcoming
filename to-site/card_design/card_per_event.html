<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ult Rank Event Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&family=Kaushan+Script&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
    <script src="assets/script.js" defer></script>
</head>
<body>
    <button id="download" class="download-btn" type="button">Download PNGs</button>

    <main id="cards" class="card-page"></main>

    <template id="card-template">
        <article class="event-card">
            <div class="card-head">
                <img class="banner" src="assets/ultrank-2026-banner.png" alt="UltRank 2026, powered by start.gg">
                <div class="card-id">
                    <img class="logo" alt="">
                    <div class="event-id">
                        <span class="name"></span>
                        <div class="event-meta">
                            <span class="tier-pill"></span>
                            <img class="flag">
                            <span class="meta"></span>
                        </div>
                        <span class="dates"></span>
                    </div>
                </div>
            </div>
            <div class="card-body players"></div>
            <div class="board-foot">
                <em>Get featured on this graphic: patreon.com/UltRank</em>
                <span>Data sourced from start.gg</span>
            </div>
        </article>
    </template>

    <template id="event-template">
        <div class="event">
            <div class="event-head">
                <img class="logo" alt="">
                <div class="event-id">
                    <span class="name"></span>
                    <div class="event-meta">
                        <span class="tier-pill"></span>
                        <img class="flag">
                        <span class="meta"></span>
                    </div>
                </div>
            </div>
            <div class="players"></div>
        </div>
    </template>

    <template id="player-template">
        <div class="chip">
            <span class="rank"></span>
            <img class="player-flag">
            <span class="tag"></span>
            <span class="mains"></span>
        </div>
    </template>
</body>
</html>
